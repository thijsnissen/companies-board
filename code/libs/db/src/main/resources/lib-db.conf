lib-db {
  host = "localhost"
  host = ${?LIB_DB_HOST}

  port = 5432
  port = ${?LIB_DB_PORT}

  driver = "postgresql"
  driver = ${?LIB_DB_DRIVER}

  database = "companies_board"
  database = ${?LIB_DB_DATABASE}

  username = "docker"
  username = ${?LIB_DB_USERNAME}

  password = "docker"
  password = ${?LIB_DB_PASSWORD}

  min-size = 10
  min-size = ${?LIB_DB_CONNECTION_POOL_MIN_SIZE}

  max-size = 20
  max-size = ${?LIB_DB_CONNECTION_POOL_MAX_SIZE}

  ttl = 30s
  ttl = ${?LIB_DB_CONNECTION_POOL_TTL}

  til = "TRANSACTION_READ_COMMITTED"
  til = ${?LIB_DB_DEFAULT_TIL}

  clean-disabled = false
  clean-disabled = ${?LIB_DB_CLEAN_DISABLED}

  migrations = [
    "classpath:db/migration"
  ]
}
